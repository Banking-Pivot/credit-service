spring:
  application:
    name: credit-service

  # Port, database URL, business zone and the customer-service URL with its timeout and
  # circuit breaker come from the Config Server: banking-config/credit-service.yml and
  # credit-service-<profile>.yml. Secrets (the database user and password, and the client
  # secret of the service token) come from Vault: secret/credit-service and
  # secret/credit-service/<profile>. Where Eureka is comes from
  # banking-config/application.yml: the service registers there as credit-service.
  config:
    import:
      - "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
      # Role ID and secret ID of this service's AppRole. In local development infra/vault
      # writes this file every time Vault starts; elsewhere point VAULT_APPROLE_FILE to the
      # file, or set SPRING_CLOUD_VAULT_APP_ROLE_ROLE_ID and SPRING_CLOUD_VAULT_APP_ROLE_SECRET_ID.
      - "optional:file:${VAULT_APPROLE_FILE:../infra/.secrets/credit-service.properties}"
      - "vault://"

  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: APPROLE
      # Without its secrets the service cannot reach its database: stop at startup with the
      # Vault error instead of failing later on a login to PostgreSQL.
      fail-fast: true
      kv:
        # Read only this service's paths, not the shared secret/application.
        default-context: ""

  # schema.sql creates the tables at every startup, in every environment. Its statements are
  # IF NOT EXISTS, so a restart keeps the data. By default Spring Boot runs it only on
  # embedded databases, and silently skips it when the file is missing: the explicit
  # location makes a missing script stop the startup instead.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # Kafka brings the payment commands of Transaction Service and takes the answers back.
  # Where the broker is comes from the Config Server (spring.kafka.bootstrap-servers in
  # credit-service-<profile>.yml); topics and retries are credit.messaging.* in
  # credit-service.yml. Keys and values are text: the value is JSON read by the service.
  kafka:
    consumer:
      group-id: credit-service
      # A group that starts for the first time reads the commands already waiting in the topic.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # An answer counts as sent once every in-sync replica has it.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # The position in the topic moves after each command, once its answer is out.
      ack-mode: record
    admin:
      # Longest wait for the broker when the topics are declared at startup. Without a broker
      # the service starts anyway and serves REST; the listener connects when the broker is up.
      operation-timeout: 10s

  reactor:
    # The correlation id of a request reaches the logs of every thread that serves it.
    context-propagation: auto

  jackson:
    # Optional fields of the contract are not nullable: absent means "does not apply"
    # (principal on a card, creditLimit and availableCredit on a loan, closedAt while active).
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

# Swagger UI shows the contract itself (served by OpenApiContractConfiguration),
# not the spec springdoc derives from the generated annotations.
springdoc:
  swagger-ui:
    url: /openapi/credit-api.yml
