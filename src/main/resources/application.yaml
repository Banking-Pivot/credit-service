spring:
  application:
    name: credit-service

  # Port, database URL, business zone and the customer-service URL with its timeout and
  # circuit breaker come from the Config Server: banking-config/credit-service.yml and
  # credit-service-<profile>.yml. Secrets (the database user and password) come from Vault:
  # secret/credit-service and secret/credit-service/<profile>.
  config:
    import:
      - "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
      # Role ID and secret ID of this service's AppRole. In local development infra/vault
      # writes this file every time Vault starts; elsewhere point VAULT_APPROLE_FILE to the
      # file, or set SPRING_CLOUD_VAULT_APP_ROLE_ROLE_ID and SPRING_CLOUD_VAULT_APP_ROLE_SECRET_ID.
      - "optional:file:${VAULT_APPROLE_FILE:../infra/.secrets/credit-service.properties}"
      - "vault://"

  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: APPROLE
      # Without its secrets the service cannot reach its database: stop at startup with the
      # Vault error instead of failing later on a login to PostgreSQL.
      fail-fast: true
      kv:
        # Read only this service's paths, not the shared secret/application.
        default-context: ""

  # schema.sql creates the tables at every startup, in every environment. Its statements are
  # IF NOT EXISTS, so a restart keeps the data. By default Spring Boot runs it only on
  # embedded databases, and silently skips it when the file is missing: the explicit
  # location makes a missing script stop the startup instead.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jackson:
    # Optional fields of the contract are not nullable: absent means "does not apply"
    # (principal on a card, creditLimit and availableCredit on a loan, closedAt while active).
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

# Swagger UI shows the contract itself (served by OpenApiContractConfiguration),
# not the spec springdoc derives from the generated annotations.
springdoc:
  swagger-ui:
    url: /openapi/credit-api.yml
