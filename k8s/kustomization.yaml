# Deployment and Service of credit-service:
#
#   kubectl kustomize k8s/                 prints both objects, no cluster needed
#   kubectl -n banking apply -k k8s/       creates or updates them in the cluster
#
# It needs the rest of the system; the whole of it is applied from the infra repository:
#   kubectl apply -k ../infra
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
